services:
  # Frontend (Next.js)
  frontend:
    build:
      context: ./apps/home-app
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* はビルド時にクライアントバンドルへ埋め込まれる。
        # ブラウザから見える URL を指定すること（コンテナ名 backend は解決できない）。
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - app-network

  # Backend (Express.js)
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOST=0.0.0.0
      - DB_DIALECT=postgres
      # ローカルの postgres コンテナは TLS を持たない（Cloud SQL では有効にする）
      - DB_SSL=false
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:?DB_USER is required (.env を作成してください)}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required (.env を作成してください)}
      - DB_NAME=${DB_NAME:?DB_NAME is required (.env を作成してください)}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?JWT_SECRET_KEY is required (openssl rand -base64 48 で生成)}
      - GEMINI_API_KEY=${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    # ローカル DB はコンテナネットワーク内のみに公開する（ホストへ晒さない）
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=${DB_USER:?DB_USER is required}
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - POSTGRES_DB=${DB_NAME:?DB_NAME is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
